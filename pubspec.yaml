name: flutter_profile_mcp
description: MCP server for Flutter performance profiling — 27 AI-queryable tools via vm_service. Ask Claude why your app is slow.
version: 1.0.5
homepage: https://github.com/cybersleuth0/flutter-profile-mcp
repository: https://github.com/cybersleuth0/flutter-profile-mcp
issue_tracker: https://github.com/cybersleuth0/flutter-profile-mcp/issues
topics:
  - flutter
  - devtools
  - mcp
  - performance
  - debugging

environment:
  sdk: ">=3.4.0 <4.0.0"

executables:
  flutter-profile-mcp: flutter_devtools_mcp

dependencies:
  dart_mcp: ^0.3.0
  vm_service: ^14.0.0
  stream_channel: ^2.1.0
  args: ^2.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
